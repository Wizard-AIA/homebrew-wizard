name: Sync formula

# Formula/wizard.rb is generated by the Wizard-w2 release workflow from that
# release's own SHA256SUMS and attached to the release as wizard.rb. This
# workflow pulls it. Nobody edits the formula by hand; a hand-edited checksum is
# how v1.0.12 shipped a formula that could not install.
#
#   schedule            catches any release even if nobody dispatched anything
#   workflow_dispatch   "Run workflow" button, for an immediate sync
#   repository_dispatch sent by Wizard-w2's release workflow when it has a
#                       PACKAGING_PUSH_TOKEN secret (event type: wizard-release)
#
# Writing it back: main is protected (changes go through pull requests). With the
# optional SYNC_PUSH_TOKEN secret (a token of someone allowed to bypass that) the
# commit goes straight to main. Without it the workflow opens or updates a pull
# request from automation/sync-formula, which needs the repository setting
# Settings > Actions > General > "Allow GitHub Actions to create and approve pull
# requests". Pull requests opened with the default token do not start other
# workflows, so Formula CI runs on the merge to main instead. If neither route is
# available the run fails and says so.

on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [wizard-release]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-formula
  cancel-in-progress: false

jobs:
  sync:
    name: Pull the latest formula
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.SYNC_PUSH_TOKEN || github.token }}

      - name: Fetch the latest release's formula
        run: |
          curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/wizard.rb" \
            "https://github.com/Wizard-AIA/Wizard-w2/releases/latest/download/wizard.rb"

      - name: Refuse anything that does not match the release
        run: |
          python3 -m unittest discover -s tests
          python3 scripts/verify_formula.py "$RUNNER_TEMP/wizard.rb"

      - name: Is it new?
        id: diff
        run: |
          if cmp -s "$RUNNER_TEMP/wizard.rb" Formula/wizard.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            cp "$RUNNER_TEMP/wizard.rb" Formula/wizard.rb
            tag="$(sed -nE 's|.*/download/(v[0-9]+\.[0-9]+\.[0-9]+)/.*|\1|p' Formula/wizard.rb | head -1)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the new formula
        if: steps.diff.outputs.changed == 'true'
        env:
          TAG: ${{ steps.diff.outputs.tag }}
          GH_TOKEN: ${{ secrets.SYNC_PUSH_TOKEN || github.token }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/wizard.rb
          git commit -m "chore(formula): wizard $TAG from the published release"

          if git push origin HEAD:main; then
            exit 0
          fi
          echo "::notice::main does not accept a direct push from this token; using a pull request"

          git push --force origin HEAD:refs/heads/automation/sync-formula
          title="chore(formula): wizard $TAG from the published release"
          body="Automated: Formula/wizard.rb rendered by the Wizard $TAG release from its published SHA256SUMS, and checked against them by scripts/verify_formula.py. Merge to publish it to the tap."
          existing="$(gh pr list --head automation/sync-formula --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
          else
            gh pr create --base main --head automation/sync-formula --title "$title" --body "$body"
          fi
